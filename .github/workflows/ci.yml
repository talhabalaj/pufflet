name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: node --test scripts/ci/*.test.mjs
      - run: npm run typecheck --prefix site
      - run: npm run build --prefix site
      - run: bash -n scripts/ci/package-release.sh && sh -n Runtime/bootstrap-runtime.sh Runtime/bundle-runtime.sh ci_scripts/*.sh
